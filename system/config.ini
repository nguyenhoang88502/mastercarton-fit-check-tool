[Search]
WeeklyBomFolder=1. Weekly BOM
Root1=
Root2=
Root3=
MaxDepth=6

[Files]
DimensionPattern=*Physical Dimension*.xlsx
BomPattern=BOM & FORMULA*D365.xlsx

[Launcher]
ForceRebuild=false
ShowConsole=false
; How often the Excel workbooks are re-read at launch (also set from the tool's Settings tab, which writes config.local.ini):
;   ask = show the Update / Skip dialog, always = every launch, daily = first launch of the day, weekly = every 7 days,
;   changed = only when a workbook changed or saves are waiting to be written, skip = never
UpdateData=ask
